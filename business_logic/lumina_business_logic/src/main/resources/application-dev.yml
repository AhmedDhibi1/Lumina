spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lumina_dev
    username: dev_user
    password: dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Important: Use 'validate' with Flyway
    show-sql: true

  flyway:
    clean-disabled: false  # Allow clean in dev (careful!)

logging:
  level:
    root: INFO
    com.snapshot.lumina: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE