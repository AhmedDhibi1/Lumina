spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/lumina_dev
    username: dev_user
    password: dev_password
    hikari:
      maximum-pool-size: 5

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password:

logging:
  level:
    com.snapshot.lumina: DEBUG
    org.springframework.cache: DEBUG
    org.hibernate.SQL: DEBUG