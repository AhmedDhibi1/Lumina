spring:
  datasource:
    url: ${DATABASE_URL}  # From environment variable
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate  # Never 'create' or 'update' in prod!
    show-sql: false

  flyway:
    clean-disabled: true  # NEVER allow clean in production!

logging:
  level:
    root: WARN
    com.snapshot.lumina: INFO