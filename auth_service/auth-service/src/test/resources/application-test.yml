server:
  port: 8081

spring:
  application:
    name: auth-service

keycloak:
  realm: lumina
  auth-server-url: http://localhost:8180
  resource: auth-service-client
  credentials:
    secret: test-secret
  ssl-required: external
  public-client: false
  confidential-port: 0
  use-resource-role-mappings: false
  default-user-role: USER

jwt:
  cookie:
    access-token:
      name: accessToken
      max-age: 900
      http-only: true
      secure: false
      same-site: Strict
    refresh-token:
      name: refreshToken
      max-age: 36000
      http-only: true
      secure: false
      same-site: Strict

cors:
  allowed-origins: http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

logging:
  level:
    lumina.snapshot.authservice: DEBUG
